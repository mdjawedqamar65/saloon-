<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sohana Beauty Saloon | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f7f3ed;
      padding: 30px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .admin-header h1 {
      font-size: 55px;
    }

    .admin-header p {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    .booking-list {
      display: grid;
      gap: 15px;
    }

    .booking-card {
      background: white;
      padding: 25px;
      border: 1px solid #e8ddd0;
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    .booking-card h3 {
      font-size: 28px;
    }

    .status {
      padding: 8px 13px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      height: fit-content;
    }

    .pending {
      background: #fff3cd;
    }

    .approved {
      background: #d1e7dd;
    }

    .cancelled {
      background: #f8d7da;
    }

    .booking-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      font-size: 12px;
      color: #555;
      margin-top: 20px;
    }

    .booking-actions {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .approve-btn,
    .cancel-btn {
      border: none;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .approve-btn {
      background: #1e1b19;
      color: white;
    }

    .cancel-btn {
      background: #ddd;
      color: #333;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #777;
    }

    @media(max-width: 600px) {
      body {
        padding: 15px;
      }

      .admin-header h1 {
        font-size: 40px;
      }

      .booking-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <div class="admin-header">
      <div>
        <p>SOHANA BEAUTY SALOON</p>
        <h1>Appointment <i>Bookings</i></h1>
      </div>

      <a href="index.html" class="btn">VIEW WEBSITE</a>
    </div>

    <div id="bookingList" class="booking-list">
      <div class="loading">Loading bookings...</div>
    </div>

  </div>

  <script type="module" src="admin.js"></script>

</body>
</html>
