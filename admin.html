<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sohana Beauty Saloon | Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f7f3ed;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      box-sizing: border-box;
      text-align: center;
      border: 1px solid #e8ddd0;
    }

    .login-box h1 {
      margin-bottom: 10px;
    }

    .login-box p {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      background: #1e1b19;
      color: white;
      cursor: pointer;
    }

    #loginError {
      color: red;
      margin-top: 15px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .booking-list {
      display: grid;
      gap: 15px;
    }

    .booking-card {
      background: white;
      padding: 25px;
      border: 1px solid #e8ddd0;
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
    }

    .status {
      padding: 8px 13px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .pending { background: #fff3cd; }
    .approved { background: #d1e7dd; }
    .cancelled { background: #f8d7da; }

    .booking-details {
      margin-top: 15px;
      line-height: 2;
    }

    .booking-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .approve-btn, .cancel-btn, #logoutBtn {
      width: auto;
      padding: 12px 18px;
    }

    .cancel-btn {
      background: #777;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->
  <div id="loginSection" class="login-box">
    <h1>Admin Login</h1>
    <p>Sohana Beauty Saloon</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>

    <div id="loginError"></div>
  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="adminSection" class="admin-container hidden">

    <div class="admin-header">
      <div>
        <p>SOHANA BEAUTY SALOON</p>
        <h1>Appointment Bookings</h1>
      </div>

      <button id="logoutBtn">LOGOUT</button>
    </div>

    <div id="bookingList" class="booking-list">
      Loading bookings...
    </div>

  </div>

  <script type="module" src="admin.js"></script>

</body>
</html>
